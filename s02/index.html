<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FLOx Concierge Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>/* FLOx shared base: tokens + functional styling for fx-* blocks. Designs override the variables and add their own layout. */
:root{
  --charcoal:#0d1c1d; --white:#fff; --teal:#94c2c7; --teal-deep:#3f6a6f; --lamp:#f3c98b; --alert:#f0a39a;
  --bg:var(--charcoal); --ink:#fff; --mute:rgba(255,255,255,.66); --card:#132829; --card2:#1b3436; --line:rgba(148,194,199,.26);
  --accent:var(--teal); --accent-ink:var(--charcoal); --field:#0d1c1d; --radius:16px; --r-sm:10px;
  --font:'Space Grotesk',ui-sans-serif,system-ui,sans-serif; --data:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --col:480px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:500;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
.fx-i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fx-mute{color:var(--mute)}
.fx-data{font-family:var(--data)}
.fx-sub{display:block;font:500 12px/1.3 var(--data);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.fx-proto{font:500 11px/1.3 var(--data);letter-spacing:.1em;text-transform:uppercase;text-align:center;padding:8px 16px;background:var(--teal);color:var(--charcoal)}
.fx-demo-btn{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--lamp);background:transparent;color:var(--lamp);font:500 14px/1 var(--font)}

/* buttons + fields */
.fx-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;padding:0 18px;border-radius:var(--r-sm);border:0;background:var(--ink);color:var(--bg);font:600 16px/1 var(--font)}
a.fx-btn{text-decoration:none}
.fx-btn[disabled]{opacity:.4;cursor:not-allowed}
.fx-btn.fx-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.fx-btn-sm{display:inline-flex;width:auto;min-height:44px;padding:0 16px;font-size:14px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
.fx-btn-sm .fx-i{width:16px;height:16px}
.fx-field{width:100%;min-width:0;min-height:48px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--field);color:var(--ink);font-size:16px}
.fx-field::placeholder{color:var(--mute)}
.fx-x{display:grid;place-items:center;min-width:44px;min-height:44px;border:0;background:transparent;color:var(--mute)}
.fx-round{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent}
.fx-add{min-height:44px;border:0;background:none;color:var(--accent);font:500 15px/1 var(--font);text-align:left;padding:0}
.fx-add[disabled]{opacity:.35;cursor:not-allowed}
.fx-err{color:var(--alert);font-size:14px}
.fx-note{padding:12px 14px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--accent) 14%,transparent);font-size:15px}
.fx-card{display:grid;gap:10px;padding:16px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line)}

/* verify blocks */
.fx-ids{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fx-idt{display:grid;gap:8px;padding:10px;border-radius:14px;background:var(--card2);border:1px dashed var(--line)}
.fx-idt.fx-selfie{grid-column:1/-1;grid-template-columns:96px 1fr;align-items:center}
.fx-idt.fx-ok{border-style:solid;border-color:var(--accent)}
.fx-frame{position:relative;aspect-ratio:1.586;border-radius:9px;overflow:hidden;display:grid;place-items:center;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,transparent) 0 8px,transparent 8px 16px);color:var(--accent)}
.fx-selfie .fx-frame{aspect-ratio:1;border-radius:50%}
.fx-frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fx-frame .fx-i{width:32px;height:32px}
.fx-busy .fx-frame::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent) 50%,transparent),transparent);animation:fxscan 1s linear infinite}
@keyframes fxscan{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
.fx-idt-t{display:grid;gap:6px;justify-items:start}
.fx-idt-t b{font-weight:500;font-size:15px}
.fx-idt-t small{font-size:14px;color:var(--mute)}
.fx-ota{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.fx-ota .fx-i{width:28px;height:28px;color:var(--accent)}
.fx-princ{display:grid;gap:8px}
.fx-pr{border-radius:12px;background:var(--card2);overflow:hidden}
.fx-pr button{display:grid;grid-template-columns:22px 1fr 18px;gap:10px;align-items:center;width:100%;min-height:52px;padding:10px 14px;border:0;background:none;text-align:left;font-weight:500}
.fx-tick{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);color:transparent}
.fx-tick .fx-i{width:12px;height:12px}
.fx-seen .fx-tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fx-chev{color:var(--mute);transition:transform .3s}
.fx-open .fx-chev{transform:rotate(90deg)}
.fx-pr p{display:none;padding:0 14px 14px 46px;font-size:15px;color:var(--mute)}
.fx-open p{display:block}
.fx-charter{border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.fx-charter-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--card2)}
.fx-charter-t{background:#fff;color:#374748;font-size:14px;line-height:1.6;padding:12px 14px;max-height:13rem;overflow:auto;display:grid;gap:8px}
.fx-charter-t.fx-full{max-height:30rem}
.fx-charter-t .fx-mute{color:#4b6365}
.fx-meta{font:400 13px/1.6 var(--data);color:#4b6365;border-bottom:1px dashed #c6d8da;padding-bottom:8px}
.fx-guests{display:grid;gap:12px}
.fx-deck{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--card2)}
.fx-seats{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fx-seat{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line)}
.fx-seat.fx-vis{border-radius:50%}
.fx-seat.fx-on{background:var(--accent);border-color:var(--accent)}
.fx-seat.fx-vis.fx-on{background:var(--lamp);border-color:var(--lamp)}
.fx-sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.fx-legend{display:flex;justify-content:space-between;gap:8px;font:400 13px/1.4 var(--data);color:var(--mute)}
.fx-stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.fx-stepper>div{display:flex;align-items:center;gap:8px}
.fx-stepper output{min-width:24px;text-align:center;font:600 18px/1 var(--data)}
.fx-people{display:grid;gap:8px}
.fx-person{display:grid;grid-template-columns:1fr 1fr 44px;gap:6px}
.fx-person.fx-me{grid-template-columns:1fr;padding:12px;border-radius:var(--r-sm);background:var(--card2);font-size:15px}
.fx-sign{display:grid;gap:12px}
.fx-sigline{position:relative;height:60px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;padding:0 4px 6px}
.fx-sigline span{font:italic 500 28px/1 var(--font);color:var(--lamp)}
.fx-sigline small{position:absolute;right:4px;bottom:-22px;font:400 12px/1 var(--data);color:var(--mute);letter-spacing:.1em}
.fx-check{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;font-size:15px;color:var(--mute);cursor:pointer;margin-top:6px}
.fx-check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent)}
.fx-cover{display:grid;gap:12px}
.fx-opts{display:grid;gap:10px}
.fx-opt{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:start;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);cursor:pointer}
.fx-opt input{margin:3px 0 0;width:20px;height:20px;accent-color:var(--accent)}
.fx-opt b{display:block;font-weight:500}
.fx-opt span{font-size:14px;color:var(--mute)}
.fx-opt em{font:600 16px/1.2 var(--data);font-style:normal}
.fx-opt.fx-sel{border-color:var(--accent)}
.fx-opt.fx-off{opacity:.4;cursor:not-allowed}
.fx-consent{font-size:14px;color:var(--mute);line-height:1.6}
.fx-stripe{display:grid;gap:8px;padding:14px;border-radius:14px;background:#fff;color:var(--charcoal)}
.fx-f{min-height:44px;border-radius:8px;border:1px solid #d5dfe0;background:#f7fafa;display:flex;align-items:center;padding:0 12px;font:400 14px/1 var(--data);color:#6b7f80}
.fx-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fx-stripe small{font-size:14px;color:#4b6365}
.fx-reject{display:grid;gap:10px;padding:18px;border-radius:var(--radius);background:color-mix(in srgb,var(--alert) 14%,var(--bg));border:1px solid color-mix(in srgb,var(--alert) 50%,transparent)}
.fx-quote{padding:10px 12px;border-left:2px solid var(--alert);font-size:15px}
.fx-rows{display:grid;gap:10px}
.fx-rowck{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:center;font-size:15px}
.fx-rowck i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.fx-rowck i .fx-i{width:14px;height:14px}
.fx-rowck.fx-wait i{background:transparent;border:1.5px dashed var(--lamp)}

/* pass blocks */
.fx-locked{display:flex;justify-content:space-between;align-items:center;gap:12px}
.fx-locked>div{min-width:0}
.fx-when{flex:none;max-width:52%;font:600 13px/1.3 var(--data);color:#7a4e12;background:#fbecd2;border-radius:999px;padding:8px 12px;text-align:center}
.fx-kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font:400 15px/1.5 var(--data)}
.fx-kv dt{color:var(--mute)}.fx-kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.fx-steps{display:grid;gap:10px}
.fx-media{aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--card2)}
.fx-media img{width:100%;height:100%;object-fit:cover}
.fx-nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fx-dots{display:flex;gap:6px}.fx-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.fx-dots i.fx-on{background:var(--accent)}
.fx-co{display:grid;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.fx-ups{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.fx-up{flex:0 0 62%;scroll-snap-align:start;display:grid;gap:8px;align-content:start;padding:14px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line)}
.fx-ic{color:var(--accent)}.fx-ic .fx-i{width:26px;height:26px}
.fx-price{font:600 14px/1 var(--data);color:var(--accent)}
.fx-status{justify-self:start;font:600 12px/1 var(--data);letter-spacing:.08em;text-transform:uppercase;padding:7px 9px;border-radius:999px;background:#fbecd2;color:#7a4e12}
.fx-wx{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.fx-wx div{display:grid;gap:4px;justify-items:center;padding:10px 4px;border-radius:12px;background:var(--card);font:400 13px/1.2 var(--data)}
.fx-wx b{font:600 16px/1 var(--font)}
.fx-wx .fx-i{color:var(--accent)}
.fx-link{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-align:left}
.fx-link>div{flex:1}.fx-link b{font-weight:500}
.fx-link>.fx-i:first-child{color:var(--accent)}
.fx-thread{display:grid;gap:8px;max-height:280px;overflow:auto}
.fx-msg{max-width:84%;padding:10px 12px;border-radius:14px;font-size:15px}
.fx-msg.fx-crew{background:var(--card2);justify-self:start;border-bottom-left-radius:4px}
.fx-msg.fx-me{background:var(--accent);color:var(--accent-ink);justify-self:end;border-bottom-right-radius:4px}
.fx-msg small{display:block;font:400 12px/1.4 var(--data);opacity:.7;margin-top:3px}
.fx-send{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.fx-aboard ul{margin:4px 0 10px;padding-left:18px}
.fx-aboard small{font:600 12px/1 var(--data);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.fx-post{display:grid;gap:12px}

/* sheet */
.fx-sheet-wrap{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.fx-sheet{width:min(var(--col),100%);max-height:86svh;overflow:auto;background:var(--bg);color:var(--ink);border-radius:var(--radius) var(--radius) 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:fxup .3s cubic-bezier(.2,.8,.2,1);font-family:var(--font);box-shadow:0 -12px 40px rgba(0,0,0,.25);border-top:1px solid var(--line)}
@keyframes fxup{from{transform:translateY(30%);opacity:0}}
.fx-sheet-h{display:flex;justify-content:space-between;align-items:center}
.fx-demo{display:grid;gap:14px}
.fx-demo fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
.fx-demo legend{font:500 12px/1 var(--data);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.fx-seg{display:flex;flex-wrap:wrap;gap:6px}
.fx-seg button{min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px}
.fx-seg button.fx-on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fx-demo select,.fx-sheet select{min-height:44px;padding:0 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--field);color:var(--ink);font-size:15px}
.fx-tiers{display:grid;gap:8px}
.fx-tier{display:flex;justify-content:space-between;gap:10px;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);text-align:left}
.fx-tier.fx-sel{border-color:var(--accent)}

@media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important} }

/* inline digital guidebook (inherits each design's tokens) */
.fx-gb{display:grid;gap:8px;scroll-margin-top:80px}
.fx-gb-h{display:flex;gap:12px;align-items:center;padding:4px 0 6px}
.fx-gb-h>.fx-i{width:26px;height:26px;color:var(--accent)}
.fx-gb-h b{font-weight:500;font-size:17px}
.fx-gbi{border-radius:var(--r-sm);background:var(--card2);border:1px solid var(--line);overflow:hidden}
.fx-gbi>button{display:grid;grid-template-columns:22px 1fr 18px;gap:12px;align-items:center;width:100%;min-height:52px;padding:10px 14px;border:0;background:none;color:var(--ink);text-align:left;font-weight:500}
.fx-gbi>button>.fx-i:first-child{color:var(--accent)}
.fx-gbb{padding:0 14px 14px 48px;font-size:15px;line-height:1.55;color:var(--ink);animation:fxgb .25s ease}
@keyframes fxgb{from{opacity:0;transform:translateY(-4px)}}
.fx-gb-list{margin:0;padding-left:18px;display:grid;gap:4px}
.fx-gb-note{font-size:14px}
/* live guidebook (real guides from Bridge) */
.fx-gb-signin{font-size:14px;margin:0}.fx-gb-signin a{color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.fx-gb-group{margin:10px 0 2px}
.fx-gbb .fx-gb-text p{margin:0 0 8px}.fx-gbb .fx-gb-text ul,.fx-gbb .fx-gb-text ol{margin:0 0 8px;padding-left:18px}.fx-gbb a{color:var(--accent);overflow-wrap:anywhere}
.fx-gb-hd{margin:10px 0 4px}
.fx-gb-place{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}.fx-gb-place:first-child{border-top:0}
.fx-gb-place small{font-size:13px;opacity:.75}.fx-gb-place p{margin:2px 0 0;font-size:14px}.fx-gb-mi{font-size:12.5px;color:var(--accent)}
/* Guide photos (2026-10-08). Defaults only — each design lays them out its own way on top. */
.fx-gb-fig{margin:10px 0}.fx-gb-img{display:block;width:100%;height:auto;max-height:420px;object-fit:cover;border-radius:12px;background:var(--card)}
.fx-gb-fig figcaption{font:400 13px/1.4 var(--data);color:var(--mute);margin-top:6px}
.fx-gb-place.fx-has-img{grid-template-columns:76px 1fr;gap:12px;align-items:start}
.fx-gb-pimg{width:76px;height:76px;object-fit:cover;border-radius:10px;background:var(--card)}
.fx-gb-place>div{display:grid;gap:2px;min-width:0}
.fx-gbi>button.fx-has-cover{grid-template-columns:44px 1fr 18px}.fx-gbi .fx-gb-thumb{width:44px;height:44px;object-fit:cover;border-radius:8px}
/* Ask FLO (sample chat, not wired to FLO yet) */
.fx-flo{display:grid;gap:8px}.fx-flo .fx-thread{max-height:none}
.fx-flo-av{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 11px/1 var(--data);letter-spacing:.04em;flex:none}
.fx-flo-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.fx-flo-chips::-webkit-scrollbar{display:none}
.fx-flo-chips button{flex:none;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 14px/1 var(--font)}
.fx-flo-note{margin:0;padding:8px 10px;border-radius:8px;border:1px dashed var(--line);font:500 12px/1.4 var(--data);letter-spacing:.04em;color:var(--mute)}
.fx-typing{display:inline-flex;gap:4px}.fx-typing i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;animation:fxty 1s infinite}.fx-typing i:nth-child(2){animation-delay:.15s}.fx-typing i:nth-child(3){animation-delay:.3s}
@keyframes fxty{50%{opacity:1;transform:translateY(-2px)}}

/* Layout: a conversation with FLO. Each step arrives as a message holding the real form; finished steps collapse into your reply.
   A pinned chip row jumps to any part of the conversation (clickable back). */
:root{--bg:#f4f7f7;--ink:#0d1c1d;--mute:#4b6365;--card:#fff;--card2:#eef4f4;--line:#d5e3e4;--accent:#3f6a6f;--accent-ink:#fff;--field:#fff;color-scheme:light}
.fx-btn{background:var(--charcoal);color:#fff}.fx-btn.fx-ghost{color:var(--ink)}
.fx-btn-sm{background:var(--accent);color:#fff}
.fx-sub{color:var(--accent)}
.fx-when{color:#7a4e12}
.app{max-width:var(--col);margin:0 auto;min-height:100svh;display:flex;flex-direction:column;background:var(--bg)}
.head{position:sticky;top:0;z-index:20;background:var(--charcoal);color:#fff}
.who{display:flex;align-items:center;gap:12px;padding:10px 16px}
.av{width:44px;height:44px;border-radius:50%;background:var(--teal);display:grid;place-items:center;flex:none}
.av img{width:30px}
.who b{display:block;font-weight:500}.who small{font:400 13px/1.2 var(--data);color:var(--teal)}
.who .fx-demo-btn{margin-left:auto}
.jump{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.jump button{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(148,194,199,.4);background:transparent;color:#fff;font:500 14px/1 var(--font)}
.jump button{min-height:44px;min-width:44px}
.log{flex:1;display:flex;flex-direction:column;gap:10px;padding:16px 12px 120px}
.day{align-self:center;font:500 12px/1 var(--data);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);padding:6px 10px;border-radius:999px;background:#e3ecec}
.b{max-width:88%;padding:12px 14px;border-radius:18px;font-size:16px;animation:pop .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}}

/* ---------- events ---------- */
const subs=[]; let last='';
function emit(why){ last=why||'state'; subs.forEach(f=>f(last)); bindLive(); }
function on(f){ subs.push(f); }
function go(stage, why){ S.stage=stage; if(!reduce) window.scrollTo(0,0); else window.scrollTo(0,0); emit(why||'stage'); }

/* ---------- unlocks (relative to 3 PM ET check-in anchor) ---------- */
function unlockAt(h){ return new Date(ANCHOR().getTime()-h*3600e3); }
function untilText(at){ const ms=at-now(); if(ms<=0) return ''; if(ms<24*3600e3){ const h=Math.floor(ms/3600e3), m=Math.round((ms%3600e3)/60e3); return `Available in ${h}h ${m}m`; } return `Available ${fmtDay(at)}, ${fmtTime(at)}`; }
function unlock(key){ const at=unlockAt(P.release[key]); return {key, at, open:now()>=at, label:untilText(at), when:`${fmtDay(at)}, ${fmtTime(at)}`, hours:P.release[key]}; }

/* ---------- people / capacity ---------- */
function caps(){ const d=Math.max(1,S.ov); return {comp:Math.max(0,Math.min(P.sleeps,d)-1), vis:Math.max(0,P.total-Math.min(P.sleeps,d))}; }
function trimPeople(){ const c=caps(); let o=0,v=0; S.people=S.people.filter(p=>p.kind==='overnight'?(++o<=c.comp):(++v<=c.vis)); }

/* ---------- actions ---------- */
function validateFile(f){
  if(/heic|heif/i.test(f.type)||/\.hei[cf]$/i.test(f.name)) return "iPhone HEIC photos aren't supported yet. Please take the photo again or choose a JPG or PNG.";
  if(!/^image\/(jpeg|png|webp)$/.test(f.type)) return 'Please use a JPG, PNG or WebP photo.';
  if(f.size>10*1024*1024) return 'That photo is over 10 MB. Please choose a smaller one.';
  return null; }
let errs={};
function setErr(k,m){ errs[k]=m||''; $$(`[data-err="${k}"]`).forEach(e=>{ e.textContent=errs[k]; e.hidden=!errs[k]; }); }
function photo(k,f){ const e=validateFile(f); setErr('ids',e); if(e) return; S.busy[k]=true; emit('upload');
  const rd=new FileReader(); rd.onload=()=>setTimeout(()=>{ S.photos[k]=rd.result; S.busy[k]=false; emit('photo'); maybeSubmit(); },900); rd.readAsDataURL(f); }
function samplePhoto(kind){ const c=document.createElement('canvas'); c.width=320; c.height=kind==='selfie'?320:202; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,c.width,c.height); g.addColorStop(0,'#3f6a6f'); g.addColorStop(1,'#94c2c7'); x.fillStyle=g; x.fillRect(0,0,c.width,c.height); x.fillStyle='rgba(255,255,255,.85)';
  if(kind==='selfie'){ x.beginPath(); x.arc(160,130,58,0,7); x.fill(); x.beginPath(); x.ellipse(160,300,110,90,0,0,7); x.fill(); }
  else if(kind==='front'){ x.fillRect(20,40,80,100); x.fillRect(120,50,170,14); x.fillRect(120,80,120,10); x.fillRect(120,100,140,10); x.font='600 16px monospace'; x.fillText('SAMPLE ID',120,170); }
  else { for(let i=0;i<22;i++) x.fillRect(20+i*13,120,i%3?6:9,50); x.fillRect(20,30,280,10); x.fillRect(20,52,200,10); }
  return c.toDataURL('image/jpeg',.8); }
function sign(){ const name=S.signName.trim();
  if(name.length<2){ setErr('sign','Please type your full legal name.'); return false; }
  if(!S.agree||!S.quiet){ setErr('sign','Please tick both boxes to sign.'); return false; }
  setErr('sign',''); const named=S.people.filter(p=>p.name.trim());
  S.signed={name,count:S.ov,overnight:named.filter(p=>p.kind==='overnight').map(p=>p.name.trim()),visitors:named.filter(p=>p.kind==='visitor').map(p=>p.name.trim())};
  emit('signed'); return true; }
function oneNight(){ return S.nights===1&&!P.oneNightExempt; }
function coverChoice(){ return oneNight()?'deposit':S.coverChoice; }
function consentText(){ const c=coverChoice(); return `By continuing, you authorize FLOHOM LLC to securely save your payment card and ${c==='waiver'?`charge ${money(P.waiver)} now as a non-refundable damage waiver.`:'charge your card only if property damage occurs during your stay.'} Your card may also be used to process any add-on services you request and we approve during your stay. Payments are processed securely by Stripe. FLOHOM never stores your card number.`; }
function pay(){ if(S.payBusy) return; S.payBusy=true; emit('paying'); setTimeout(()=>{ const c=coverChoice(); S.cover={type:c,amount:c==='waiver'?P.waiver:P.deposit}; S.payBusy=false; S.paying=false; emit('covered'); maybeSubmit(); },1100); }
let submitting=false;
function maybeSubmit(){ if(!submitting&&allDone()&&S.status==='pending'&&S.stage==='verify'){ submitting=true; setTimeout(()=>{ submitting=false; if(S.stage==='verify') go('review','submitted'); },700); } }
function approve(){ S.status='verified'; emit('approved'); setTimeout(()=>go('pass','approved'), reduce?0:(FX.approveDelay||1800)); }
function decline(code){ S.status='rejected'; S.reject=code; if(REASONS[code].reupload&&!ota()) S.photos={front:null,back:null,selfie:null}; go('verify','declined'); }
function fillSamples(){
  if(!ota()&&!(S.photos.front&&S.photos.back&&S.photos.selfie)) S.photos={front:samplePhoto('front'),back:samplePhoto('back'),selfie:samplePhoto('selfie')};
  if(!S.signed){ S.signName='Jordan Sample'; S.agree=S.quiet=true; S.signed={name:'Jordan Sample',count:2,overnight:['Alex Sample'],visitors:['Sam Visitor']}; }
  if(!S.cover) S.cover=oneNight()?{type:'deposit',amount:P.deposit}:{type:'waiver',amount:P.waiver}; }
function resetVerify(){ Object.assign(S,{status:'pending',reject:null,photos:{front:null,back:null,selfie:null},signed:null,cover:null,ov:2,people:[],signName:'',agree:false,quiet:false,paying:false,openPr:{},seenPr:{}}); }

/* ---------- derived data ---------- */
function pass(){ const s=S.signed||{name:'Jordan Sample',count:2,overnight:['Alex Sample'],visitors:['Sam Visitor']}; const early=S.ups[1], late=S.ups[2];
  return { checkIn:{time:early==='Paid'?'1:00 PM':'3:00 PM', day:fmtDay(ANCHOR()), note:early==='Paid'?'Early check-in':early==='Requested'?'Early check-in pending':''},
    checkOut:{time:late==='Paid'?'12:00 PM':'10:00 AM', day:fmtDay(CHECKOUT()), note:late==='Paid'?'Late check-out':late==='Requested'?'Late check-out pending':''},
    lead:shortName(s.name), leadFull:s.name, guests:s.count, nights:S.nights, visitors:s.visitors.length, aboard:s.count+s.visitors.length,
    overnight:[s.name,...s.overnight], unnamed:Math.max(0,s.count-1-s.overnight.length), visitorNames:s.visitors, conf:P.conf }; }
function visibleUps(){ const days=(ANCHOR()-now())/864e5; return UPS.filter(u=>u.noNotice||days>=7); }
function heroFacts(){ return [`${fmtDay(ANCHOR())} to ${fmtDay(CHECKOUT())}`,`${S.nights} night${S.nights>1?'s':''}`,`Slip ${P.slip}`]; }

   <button type="button" class="fx-add" data-fx="add-vis" ${nV>=c.vis?'disabled':''}>+ Add a day visitor</button></div>`; };
ui.sign=()=>`<div class="fx-sign"><label class="fx-sub" for="fxSig">Type your full legal name</label><input class="fx-field" id="fxSig" autocomplete="name" placeholder="Jordan Sample" value="${esc(S.signName)}" data-fx-input="signName"><div class="fx-sigline" aria-hidden="true"><span data-fx-sigpreview>${esc(S.signName)}</span><small>SIGNATURE</small></div>

const GUIDE=[
 ['book','House rules',()=>`<ul class="fx-gb-list">${PRINCIPLES.map(([t])=>`<li>${esc(t)}</li>`).join('')}<li>Up to ${P.sleeps} guests overnight, ${P.total} aboard at once (marina limit)</li></ul>`],
 ['anchor','Marina amenities and showers',()=>`<p>Restrooms and hot showers are in the marina building at the head of the pier; your gate card opens them. Trash and recycling bins are by the pier gate.</p>`],

 ['sun','Local tips: Fells Point, Federal Hill',()=>`<p><b>Fells Point:</b> cobblestone streets, waterfront bars and the water taxi. <b>Federal Hill:</b> the park at the top has the best view of the harbor at sunset.</p>`],

const gbIcon=t=>/wi-?fi|internet/i.test(t)?'wifi':/check-?in|check-?out|door|keys?|lock|access|entry|parking/i.test(t)?'door':/rules?|safety|emergenc/i.test(t)?'shield':/marina|dock|slip|boat/i.test(t)?'anchor':'book';
/* One guide list for every design: live from Bridge (with its vetted photos) or the sample, which uses

function guides(){ const L=window.FXLive?FXLive.view():{status:'error'}, live=L.status==='ok'&&L.data&&L.data.groups.length?L.data:null;

ui.guidebook=()=>{ const G=guides();
  const head=`<div class="fx-gb-h">${ICON.book}<div><b>Your Digital Guidebook</b><p class="fx-mute">${esc(P.name)} · ${esc(P.nick)} · ${G.live?'live from Bridge':'sample content'}</p></div></div>`;

ui.receipt=()=>`<button type="button" class="fx-link" data-fx="rcpt">${ICON.receipt}<div><b>Receipt and payment details</b><p class="fx-mute">Opens your booking receipt</p></div>${ICON.right}</button>`;

const FLO_SAY=[
  q=>/early|late|check/i.test(q)?`Early check-in depends on the boat before you. I'll ask the crew and message you here as soon as I know.`:null,
  q=>/eat|dinner|food|restaurant/i.test(q)?`Your Voyager Guide has the crew's picks near ${P.marina}, with photos and walking distances. Want me to book a private chef instead?`:null,

  ()=>`Good question. In the live version I'd answer from ${P.nick}'s guidebook and the crew's notes. Here it's a sample reply.`];
function floSend(text){ const q=String(text||'').trim(); if(!q||S.floBusy) return; S.flo.push({me:1,t:q}); S.floDraft=''; S.floBusy=true; emit('flo');
  setTimeout(()=>{ S.flo.push({me:0,t:FLO_SAY.map(f=>f(q)).find(Boolean)}); S.floBusy=false; emit('flo'); }, reduce?0:900); }

ui.floMsgs=()=>S.flo.map(m=>`<div class="fx-msg ${m.me?'fx-me':'fx-crew'}">${esc(m.t)}</div>`).join('')+(S.floBusy?`<div class="fx-msg fx-crew" aria-label="FLO is typing"><span class="fx-typing"><i></i><i></i><i></i></span></div>`:'');
ui.floChips=()=>`<div class="fx-flo-chips">${FLO_ASK.map(q=>`<button type="button" data-fx="flo-ask" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`;
ui.floInput=(ph='Ask FLO anything')=>`<div class="fx-send"><input class="fx-field" maxlength="500" placeholder="${esc(ph)}" value="${esc(S.floDraft)}" data-fx-input="floDraft" aria-label="Ask FLO"><button type="button" class="fx-btn fx-btn-sm" data-fx="flo-send">Ask</button></div>`;
ui.flo=()=>`<div class="fx-flo"><div class="fx-thread">${ui.floMsgs()}</div>${ui.floChips()}${ui.floInput()}${ui.floNote()}</div>`;
ui.aboard=()=>{ const p=pass(); return `<div class="fx-aboard"><span class="fx-sub">Overnight guests</span><ul>${p.overnight.map((n,i)=>`<li>${esc(n)}${i===0?' <small>Lead guest</small>':''}</li>`).join('')}${p.unnamed?`<li class="fx-mute">+ ${p.unnamed} more</li>`:''}</ul>${p.visitorNames.length?`<span class="fx-sub">Visitors, until 10 PM</span><ul>${p.visitorNames.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}</div>`; };
ui.post=()=>`<div class="fx-post"><div class="fx-card"><h4>How was your stay?</h4><p class="fx-mute">A few words help the next guest find their FLOHOM.</p><a class="fx-btn" href="${P.reviewUrl}" target="_blank" rel="noopener">Leave a review</a></div><div class="fx-card"><h4>Come back anytime</h4><a class="fx-btn" href="${P.bookUrl}" target="_blank" rel="noopener">Book ${P.nick}</a><a class="fx-btn fx-ghost" href="${P.allUrl}" target="_blank" rel="noopener">See all FLOHOMs</a></div>${ui.guidebook()}</div>`;
ui.demoBtn=(cls='')=>`<button type="button" class="fx-demo-btn ${cls}" data-fx="demo">Demo controls</button>`;
ui.proto=()=>`<div class="fx-proto">Prototype · sample guest · nothing is uploaded, saved or charged</div>`;

/* ---------- sheets ---------- */
function sheet(title,html){ const h=$('#fxSheet')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'fxSheet'}));
  h.innerHTML=`<div class="fx-sheet-wrap" data-fx="sheet-bg"><div class="fx-sheet" role="dialog" aria-label="${esc(title)}"><div class="fx-sheet-h"><h3>${esc(title)}</h3><button type="button" class="fx-x" data-fx="sheet-x" aria-label="Close">${I('<path d="M6 6l12 12M18 6L6 18"/>')}</button></div>${html}</div></div>`; }
function closeSheet(){ const h=$('#fxSheet'); if(h) h.innerHTML=''; }
function openUpsell(id){ const u=UPS.find(x=>x.id===id), st=S.ups[id]; let sel=0;
  sheet(u.name, `<p class="fx-mute">${esc(u.desc)}</p>${st?`<div class="fx-card"><span class="fx-status">${st}</span><p class="fx-mute">${STATUS_INFO[st]}</p></div>`:`<div class="fx-tiers">${u.tiers.map(([n,p],i)=>`<button type="button" class="fx-tier ${i===0?'fx-sel':''}" data-fx="tier" data-t="${i}"><span>${esc(n)}</span><b class="fx-data">$${p}</b></button>`).join('')}</div><textarea class="fx-field" maxlength="300" rows="2" placeholder="${u.bday?"Who's celebrating? Anything we should know?":'Optional note for our crew'}"></textarea><button type="button" class="fx-btn" data-fx="req" data-id="${id}">Request: $${u.tiers[0][1]}</button><p class="fx-mute">You won't be charged until our crew approves.</p>`}`);
  FX._tier=0; }
const TIMES=()=>[['2026-10-08T10:00:00-04:00','Thu 8 Oct, 10 AM (8 days before)'],['2026-10-12T10:00:00-04:00','Mon 12 Oct, 10 AM (4 days before)'],['2026-10-15T16:00:00-04:00','Thu 15 Oct, 4 PM (day before)'],['2026-10-16T09:00:00-04:00','Fri 16 Oct, 9 AM (check-in day)'],['2026-10-16T13:30:00-04:00','Fri 16 Oct, 1:30 PM (90 min before)'],['2026-10-17T11:00:00-04:00','Sat 17 Oct (during the stay)'],[new Date(CHECKOUT().getTime()+864e5).toISOString(),'Day after check-out']];
function openDemo(){ const seg=(name,opts,cur)=>`<div class="fx-seg" data-seg="${name}">${opts.map(([v,l])=>`<button type="button" data-fx="seg" data-seg="${name}" data-v="${v}" class="${String(cur)===String(v)?'fx-on':''}">${l}</button>`).join('')}</div>`;
  sheet('Demo controls', `<div class="fx-demo"><p class="fx-mute">Prototype only. Guests never see this. It lets you walk every state of the one FLOx link.</p>
    ${window.FXLive?`<fieldset><legend>FLOHOM</legend><select data-fx-home aria-label="FLOHOM">${Object.entries(FXLive.HOMES).map(([n,nick])=>`<option value="${n}" ${+n===FXLive.n?'selected':''}>FLOHOM ${n} · ${esc(nick)}</option>`).join('')}</select><p class="fx-mute">Changes the guidebook, name, Book and review links. Signed in to Bridge as an owner, the guidebook is the real one. Other pass details stay the FLOHOM 1 sample.</p></fieldset>`:''}
    <fieldset><legend>Jump to</legend>${seg('stage',[['verify','Verify'],['review','Review'],['rejected','Declined'],['pass','FLOx Pass'],['post','After check-out']],S.status==='rejected'?'rejected':S.stage)}</fieldset>
    <fieldset><legend>Crew review (admin side)</legend><div class="fx-seg"><button type="button" data-fx="d-approve">Approve</button><select data-fx-reason aria-label="Decline reason">${Object.entries(REASONS).map(([k,r])=>`<option value="${k}">${r.label}</option>`).join('')}</select><button type="button" data-fx="d-decline">Decline</button></div></fieldset>
    <fieldset><legend>Booking channel</legend>${seg('channel',[['direct','Direct / website'],['airbnb','Airbnb'],['vrbo','VRBO']],S.channel)}<p class="fx-mute">Airbnb and VRBO guests skip the ID photos.</p></fieldset>
    <fieldset><legend>Stay length</legend>${seg('nights',[[1,'1 night'],[2,'2 nights'],[3,'3 nights'],[4,'4 nights']],S.nights)}<p class="fx-mute">One-night stays get the Security Deposit only.</p></fieldset>
    <fieldset><legend>Pretend it's (pass unlocks)</legend><select data-fx-time>${TIMES().map(([v,l])=>`<option value="${v}" ${v===S.now?'selected':''}>${l}</option>`).join('')}</select></fieldset>
    <button type="button" class="fx-btn fx-ghost" data-fx="d-fill">Fill sample answers for steps A to C</button></div>`); }

/* ---------- delegated events ---------- */
document.addEventListener('click',e=>{ const t=e.target.closest('[data-fx]'); if(!t) return; const a=t.dataset.fx;
  if(a==='sheet-bg'&&e.target!==t) return;
  switch(a){
    case 'pr': { const i=+t.dataset.i; S.openPr[i]=!S.openPr[i]; S.seenPr[i]=true; emit('ui'); break; }
    case 'charter': S.charterFull=!S.charterFull; emit('ui'); break;
    case 'ov-': S.ov=Math.max(1,S.ov-1); emit('ui'); break;
    case 'ov+': S.ov=Math.min(P.sleeps,S.ov+1); emit('ui'); break;
    case 'add-ov': S.people.push({kind:'overnight',name:'',phone:''}); emit('ui'); break;
    case 'add-vis': S.people.push({kind:'visitor',name:'',phone:''}); emit('ui'); break;
    case 'rm': S.people.splice(+t.dataset.i,1); emit('ui'); break;
    case 'sign': sign(); break;
    case 'to-pay': S.paying=true; emit('ui'); break;
    case 'pay-back': S.paying=false; emit('ui'); break;
    case 'pay': pay(); break;
    case 'resubmit': S.status='pending'; S.reject=null; go('review','resubmitted'); break;
    case 'call': sheet('Call us',`<p class="fx-data" style="font-size:22px">${P.phone}</p><p class="fx-mute">Baltimore and Maryland crew line.</p>`); break;
    case 'st-prev': S.stepIdx=Math.max(0,S.stepIdx-1); emit('ui'); break;
    case 'st-next': S.stepIdx=Math.min(STEPS_IN.length-1,S.stepIdx+1); emit('ui'); break;
    case 'up': openUpsell(+t.dataset.id); break;
    case 'tier': $$('.fx-tier').forEach(x=>x.classList.remove('fx-sel')); t.classList.add('fx-sel'); FX._tier=+t.dataset.t; { const b=$('[data-fx="req"]'); const u=UPS.find(x=>x.id===+b.dataset.id); b.textContent=`Request: $${u.tiers[FX._tier][1]}`; } break;
    case 'req': S.ups[+t.dataset.id]='Requested'; closeSheet(); emit('upsell'); break;
    case 'send': { const v=S.msgDraft.trim(); if(!v) break; S.thread.push({me:1,t:v,at:'You · just now'}); S.msgDraft=''; emit('message'); break; }
    case 'flo-send': floSend(S.floDraft); break;
    case 'flo-ask': floSend(t.dataset.q); break;
    case 'gb': { const g=document.getElementById('fx-guidebook'); if(g){ g.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'}); } else sheet('Your Digital Guidebook',ui.guidebook()); break; }
    case 'gb-item': { const i=t.dataset.i; S.openGb=S.openGb===i?null:i; if($('#fxSheet .fx-gb')){ $('#fxSheet .fx-gb').outerHTML=ui.guidebook(); } else emit('ui'); break; }
    case 'rcpt': sheet('Receipt and payment details','<p class="fx-mute">Opens your Hostaway booking receipt in a new tab on the live pass.</p>'); break;
    case 'demo': openDemo(); break;
    case 'sheet-x': case 'sheet-bg': closeSheet(); break;
    case 'seg': { const seg=t.dataset.seg, v=t.dataset.v; closeSheet();
      if(seg==='stage'){ if(v==='rejected'){ fillSamples(); decline('unclear_photo'); return; }
        if(v==='verify'){ resetVerify(); go('verify','demo'); return; }
        fillSamples(); S.status=v==='review'?'pending':'verified'; if(v==='post') S.now=new Date(CHECKOUT().getTime()+864e5).toISOString(); else if(new Date(S.now)>CHECKOUT()) S.now='2026-10-08T10:00:00-04:00'; go(v,'demo'); }
      if(seg==='channel'){ S.channel=v; emit('demo'); }
      if(seg==='nights'){ S.nights=+v; if(S.cover&&S.nights===1&&S.cover.type==='waiver') S.cover=null; emit('demo'); }
      break; }
    case 'd-approve': closeSheet(); if(S.stage!=='review'){ fillSamples(); go('review','demo'); setTimeout(approve,2600); } else approve(); break;
    case 'd-decline': { const r=$('[data-fx-reason]').value; closeSheet(); fillSamples(); decline(r); break; }
    case 'd-fill': closeSheet(); fillSamples(); emit('demo'); maybeSubmit(); break;
  } });
document.addEventListener('change',e=>{ const t=e.target;
  if(t.matches('[data-fx-photo]')&&t.files[0]) photo(t.dataset.fxPhoto,t.files[0]);
  else if(t.matches('[data-fx-check]')) S[t.dataset.fxCheck]=t.checked;
  else if(t.matches('[data-fx-cover]')){ S.coverChoice=t.value; emit('ui'); }
  else if(t.matches('[data-fx-home]')){ closeSheet(); FXLive.setHome(t.value); }
  else if(t.matches('[data-fx-time]')){ S.now=t.value; closeSheet(); if(new Date(S.now)>CHECKOUT()&&S.status==='verified') go('post','demo'); else if(S.stage==='post') go('pass','demo'); else emit('demo'); } });
document.addEventListener('input',e=>{ const t=e.target;
  if(t.matches('[data-fx-input]')){ S[t.dataset.fxInput]=t.value; if(t.dataset.fxInput==='signName') $$('[data-fx-sigpreview]').forEach(x=>x.textContent=t.value); }
  else if(t.matches('[data-fx-person]')){ const p=S.people[+t.dataset.fxPerson]; if(p) p[t.dataset.f]=t.value; } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); if(e.key==='Enter'&&e.target.matches('[data-fx-input="msgDraft"]')) $('[data-fx="send"]')?.click(); if(e.key==='Enter'&&e.target.matches('[data-fx-input="floDraft"]')) floSend(S.floDraft); });
function bindLive(){}
if(window.FXLive) FXLive.on(()=>{ applyHome(); S.openGb=null; const g=$('#fxSheet .fx-gb'); if(g) g.outerHTML=ui.guidebook(); emit('ui'); });

window.FX={ P,S,on,emit,go,ui,ICON,esc,$,$$,reduce,pass,unlock,heroFacts,ota,otaName,idDone,allDone,approve,decline,fillSamples,sheet,closeSheet,openDemo,fmtDay,fmtTime,ANCHOR,CHECKOUT,money,PRINCIPLES,STEPS_IN,UPS,visibleUps,guides,gbNote,floSend, approveDelay:1800, get why(){ return last; } };
})();

<script>
(function(){
const {S,P,ui,ICON,esc}=FX; let asked=[], lastGb=S.openGb; // pass-stage questions the guest tapped, in order
const flo=(t,id='')=>`<div class="b flo" ${id?`id="${id}"`:''}>${t}</div>`, me=t=>`<div class="b me">${t}</div>`, w=(h,id='')=>`<div class="w" ${id?`id="${id}"`:''}>${h}</div>`;
function passCard(){ const p=FX.pass(); return `<div class="passcard"><div class="ph"><img src="img/ext-night-l.webp" alt=""><span>FLOx PASS · F01</span></div><div class="rt"><div><small>Check-in</small><b>${p.checkIn.time}</b><em>${p.checkIn.day}</em></div><div><small>Check-out</small><b>${p.checkOut.time}</b><em>${p.checkOut.day}</em></div><div><small>Lead guest</small><b style="font-size:18px">${esc(p.lead)}</b></div><div><small>Aboard</small><b style="font-size:18px">${p.guests} overnight · ${p.visitors} visitor${p.visitors===1?'':'s'}</b></div></div><div class="ft"><span>Verified for arrival</span><span>${p.conf}</span></div></div>`; }
const TOPICS={ in:['Check-in',()=>flo('Here is how to get aboard, step by step.')+w(ui.checkin())],
  out:['Check-out',()=>flo('Check-out steps:')+w(ui.checkout())], ups:['Extras',()=>flo('A few ways to make the stay yours:')+w(ui.upsells())],

/* ---------- the trip kit: WiFi · Check-in Pass · Ask FLO · Guidebooks ---------- */
const KIT=[['wifi','WiFi'],['pass','Pass'],['flo','Ask FLO'],['gb','Guides']];
const kw=(h,cls='')=>`<div class="w kw ${cls}">${h}</div>`;
const kitMsg=(n,k,label,text)=>`<div class="b flo kit-b" id="k-${k}"><span class="kit-n">${n} of 4 · ${label}</span>${text}</div>`;
function guideCard(x){ const on=S.openGb===x.key; return `<button type="button" class="lp ${on?'on':''}" data-fx="gb-item" data-i="${esc(x.key)}" aria-expanded="${on}"><span class="lp-ph">${x.cover?`<img src="${esc(x.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:`<span class="lp-ic">${ICON[x.icon]||ICON.book}</span>`}${x.photos?`<span class="lp-n">${x.photos} photo${x.photos>1?'s':''}</span>`:''}</span><span class="lp-t"><b>${esc(x.title)}</b><small>${on?'Open below':'Tap to read'}</small></span></button>`; }
function article(x,live){ return `<article class="art" id="gb-open" aria-label="${esc(x.title)}">${x.cover?`<div class="art-ph"><img src="${esc(x.cover)}" alt="" referrerpolicy="no-referrer"></div>`:''}<div class="art-h"><div><span class="fx-sub">${live?'Live from Bridge':'Sample guide'}</span><h3>${esc(x.title)}</h3></div><button type="button" class="fx-round" data-fx="gb-item" data-i="${esc(x.key)}" aria-label="Close guide">✕</button></div><div class="art-b">${x.body}</div><button type="button" class="fx-btn fx-btn-sm fx-ghost" data-fx="gb-item" data-i="${esc(x.key)}">${ICON.left}All guides</button></article>`; }
function guidebooks(){ const G=FX.guides(), open=S.openGb&&G.groups.flatMap(g=>g.guides).find(x=>x.key===S.openGb);
  return `${G.line?`<p class="fx-mute fx-gb-signin">${G.line}</p>`:''}${G.groups.map(g=>`<div class="lp-g"><span class="fx-sub">${esc(g.label)}</span><span class="fx-mute">${g.guides.length} guide${g.guides.length===1?'':'s'}</span></div><div class="lps">${g.guides.map(guideCard).join('')}</div>${open&&g.guides.includes(open)?article(open,G.live):''}`).join('')}<p class="fx-mute fx-gb-note">${FX.gbNote(G.live)}</p>`; }
function kit(){ return [`<div class="day kit-day" id="k-kit">Your trip kit · 4 cards</div>`,
  kitMsg(1,'wifi','WiFi','Online the moment you step aboard.')+kw(`<div class="kh">${ICON.wifi}<b>FLOHOM WiFi</b></div>${ui.wifi()}`),
  kitMsg(2,'pass','Check-in Pass','Your FLOx Pass. Show this at the slip if anyone asks.')+kw(passCard()+ui.aboard()),
  kitMsg(3,'flo','Ask FLO','Ask me anything, any hour. Tap a question or type your own.')+kw(`<div class="dm"><span class="fx-flo-av">FLO</span><div><b>FLO</b><small>FLOHOM concierge · replies in seconds</small></div></div><div class="fx-thread">${ui.floMsgs()}</div>${ui.floChips()}<div id="flo-in" class="kit-in">${ui.floInput('Message FLO...')}${ui.floNote()}</div><div class="crew"><span class="fx-sub">Rather talk to the crew?</span>${ui.contact()}</div>${ui.receipt()}`,'kit-flo'),
  kitMsg(4,'gb','Guidebooks',`Everything about ${esc(P.nick)}, with photos.`)+kw(guidebooks(),'kit-gb')].join(''); }
function convo(){ const out=[`<div class="day">${FX.fmtDay(new Date(S.now))}</div>`];
  out.push(flo(`Hi Jordan, I'm FLO, your FLOHOM concierge. Three quick things and your FLOx Pass for <b>${P.name} · ${P.nick}</b> unlocks.<div class="thumbs" style="flex-wrap:wrap">${FX.heroFacts().map(f=>`<span class="fx-status" style="background:#e3ecec;color:#0d1c1d">${f}</span>`).join('')}</div>`,'c-hi'));
  if(S.status==='rejected') out.push(flo('Update from our crew:')+w(ui.rejected()));
  out.push(flo('<b>Step A.</b> A photo of your ID, front and back, plus a quick selfie.','c-a'));
  if(FX.idDone()&&S.status!=='rejected') out.push(me(FX.ota()?`Verified through ${FX.otaName()}`:`ID uploaded<div class="thumbs">${['front','back','selfie'].map(k=>`<img src="${S.photos[k]}" alt="">`).join('')}</div>`));
  else { out.push(w(ui.ids())); return out.join(''); }
  out.push(flo('<b>Step B.</b> Thanks! Here is how we live aboard. Tap each one to read it.','c-b'));
  if(S.signed) out.push(me(esc(FX.ui.summary('B'))));
  else { out.push(w(ui.principles()+ui.charter())); out.push(flo("Who's staying with you?")); out.push(w(ui.guests())); out.push(flo('Then sign here:')); out.push(w(ui.sign())); return out.join(''); }
  out.push(flo('<b>Step C.</b> Last one: your Peace-of-Mind Cover.','c-c'));
  if(S.cover) out.push(me(esc(FX.ui.summary('C')))); else { out.push(w(ui.cover())); return out.join(''); }
  out.push(flo(`All in. Our crew is reviewing it now (usually under 2 hours). I'll email you when your pass is ready.`,'c-rev'));
  if(S.stage==='review'){ out.push(w(ui.reviewRows())); out.push(S.status==='verified'?flo("Approved! Getting your pass..."):'<div class="typing" aria-label="FLO is waiting for the crew"><i></i><i></i><i></i></div>'); return out.join(''); }
  out.push(flo(`You're cleared to board, Jordan.`,'c-pass')); if(S.stage==='post') out.push(w(passCard()));
  if(S.stage==='post'){ out.push(flo(`Thanks for staying aboard ${P.nick}. Checked out ${FX.fmtDay(FX.CHECKOUT())}.`,'c-post')); out.push(w(ui.post())); return out.join(''); }
  out.push(flo('Your trip kit is below: WiFi, your pass, me, and the guidebooks. The chips at the bottom bring up check-in, check-out, extras and weather.'));
  asked.forEach((k,n)=>{ out.push(`<div id="q-${n}"></div>`+me(TOPICS[k][0])+TOPICS[k][1]()); });
  out.push(kit());
  return out.join(''); }
function render(scroll){
  const log=document.getElementById('log'); log.innerHTML=convo();
  const marks=[['c-hi','Start'],['c-a','ID'],['c-b','Agreement'],['c-c','Cover'],['c-rev','Review'],['c-pass','Cleared'],['k-kit','Trip kit'],['c-post','Thanks']].filter(([id])=>document.getElementById(id));
  document.getElementById('jump').innerHTML=marks.map(([id,l])=>`<button type="button" data-jump="${id}">${l}</button>`).join('')+asked.map((k,n)=>`<button type="button" data-jump="q-${n}">${TOPICS[k][0]}</button>`).join('');
  document.getElementById('chips').innerHTML=S.stage==='pass'?KIT.map(([k,l])=>`<button type="button" class="kc" data-jump="k-${k}">${l}</button>`).join('')+Object.entries(TOPICS).map(([k,[l]])=>`<button type="button" data-ask="${k}">${l}</button>`).join(''):S.stage==='verify'?'<button type="button" data-jump="c-a">Back to my ID</button><button type="button" data-fx="call">Call the crew</button>':'';
  if(scroll) requestAnimationFrame(()=>{ if(S.stage==='pass') toId('c-pass'); else window.scrollTo({top:document.body.scrollHeight,behavior:FX.reduce?'auto':'smooth'}); });
  if(S.openGb!==lastGb){ const was=lastGb; lastGb=S.openGb; if(S.stage==='pass'&&(S.openGb||was)) requestAnimationFrame(()=>toId(S.openGb?'gb-open':'k-gb')); }
}
function toId(id){ const el=document.getElementById(id); if(el) window.scrollTo({top:el.getBoundingClientRect().top+scrollY-140,behavior:FX.reduce?'auto':'smooth'}); }
function floInView(){ const el=document.getElementById('flo-in'); if(!el) return; const r=el.getBoundingClientRect(), room=innerHeight-document.getElementById('chips').offsetHeight-12;
  window.scrollTo({top:Math.max(0,scrollY+r.bottom-room),behavior:'auto'}); }
document.addEventListener('click',e=>{ const j=e.target.closest('[data-jump]'); if(j) toId(j.dataset.jump);
  const a=e.target.closest('[data-ask]'); if(a){ asked.push(a.dataset.ask); render(false); toId('q-'+(asked.length-1)); } });
FX.on(why=>{ if(why==='stage'&&S.stage!=='pass') asked=[]; render(['photo','signed','covered','stage','submitted','approved','message','declined','resubmitted','demo'].includes(why)); if(why==='flo') floInView(); });
render(false);
})();
</script></body></html>
